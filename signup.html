<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | SkyWay</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card wide">
    <a class="brand center" href="index.html">✈ SkyWay</a>
    <h1>Create Account</h1>
    <p class="muted">Enter your details to start booking.</p>

    <form id="signupForm">
      <div class="two">
        <div>
          <label for="name">Full Name</label>
          <input id="name" type="text" placeholder="Your full name" required>
        </div>
        <div>
          <label for="age">Age</label>
          <input id="age" type="number" min="1" max="100" required>
        </div>
      </div>

      <label for="gender">Gender</label>
      <select id="gender" required>
        <option value="">Select gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>

      <label for="username">Username</label>
      <input id="username" type="text" required>

      <label for="password">Password</label>
      <input id="password" type="password" minlength="6" required>

      <button class="btn primary full" type="submit">Create Account</button>
    </form>

    <p class="switch">Already have an account? <a href="login.html">Login</a></p>
  </div>
  <script src="js/signup.js"></script>
</body>
</html>
